upstream nc {
    server nextcloud:80;
}
upstream lool {
    server collabora:9980;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    proxy_connect_timeout  60s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # Collabora: static browser assets (JS, CSS, images)
    location ^~ /browser {
        proxy_pass http://lool;
        proxy_set_header Host $http_host;
    }

    # Collabora: WOPI discovery and capabilities
    location ^~ /hosting {
        proxy_pass http://lool;
        proxy_set_header Host $http_host;
    }

    # Collabora: WebSocket editor connections (cool = v21+, lool = older)
    location ~ ^/(cool|lool)/ {
        proxy_pass http://lool;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
    }

    # NextCloud: everything else
    location / {
        proxy_pass http://nc;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable compression so sub_filter can scan response bodies
        proxy_set_header Accept-Encoding   "";
        proxy_request_buffering off;
        # Rewrite the hardcoded Collabora AP-IP in richdocuments responses to
        # whatever IP the client actually used — works for both Wi-Fi and ethernet.
        sub_filter 'http://10.42.0.1:8081' 'http://$http_host';
        sub_filter_once off;
        sub_filter_types application/json text/javascript application/javascript;
    }
}
